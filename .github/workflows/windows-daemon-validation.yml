name: Windows daemon validation
on:
  push:
    branches: [validation/windows-daemon-1274-20261006-1903]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          run-install: false
          cache: false
      - name: Install verified ROS Rolling Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\r | Out-Null
          $url = 'https://github.com/ros2/ros2/releases/download/release-rolling-nightlies/ros2-rolling-nightly-windows-amd64.zip'
          curl.exe --fail --location --retry 2 $url -o C:\r\ros.zip
          if ($LASTEXITCODE -ne 0) { throw 'ROS download failed' }
          $hash = (Get-FileHash C:\r\ros.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '480c25977aecb78352c15f51dfb1937a714fb5a75d0ea3dfe843939b4b4ce3e6') { throw 'ROS archive digest changed' }
          & 'C:\Program Files\7-Zip\7z.exe' x C:\r\ros.zip -oC:\r\ros -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'ROS extraction failed' }
          $setup = Get-ChildItem C:\r\ros -Recurse -Filter local_setup.bat | Sort-Object { $_.FullName.Length } | Select-Object -First 1
          if (-not $setup) { throw 'ROS setup not found' }
          $root = $setup.Directory.FullName
          "ROS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Set-Location $root
          if (-not (Test-Path pixi.toml)) { throw 'ROS binary dependency manifest is missing' }
          pixi install
          if ($LASTEXITCODE -ne 0) { throw 'ROS dependencies failed' }
          if (Test-Path preinstall_setup_windows.py) {
            pixi run python preinstall_setup_windows.py
            if ($LASTEXITCODE -ne 0) { throw 'ROS relocation failed' }
          }
      - name: Test real Windows sockets and daemon lifecycle
        shell: pwsh
        run: |
          Set-Location $env:ROS_ROOT
          pixi run cmd /c "$env:GITHUB_WORKSPACE\_validation\run_windows.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
